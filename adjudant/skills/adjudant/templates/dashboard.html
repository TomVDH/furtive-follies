  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:var(--fs-body);line-height:1.5;color:var(--text);background:var(--bg);
    display:flex;flex-direction:column;min-height:100vh}
  h1,h2,h3{font-weight:600;line-height:1.2}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .brand-mark{width:64px;height:auto;flex:none;position:relative;z-index:2;display:block}
  .brand-text{min-width:0}
  .brand-line{display:flex;align-items:baseline;gap:7px;min-width:0}
  /* Which adjudant drew this page. Stamped at scaffold time, because the file
     is static once written: a board made by 4.1.9 must keep saying 4.1.9 when
     the plugin has moved on, or the stamp is a guess. Sized and coloured to be
     found when looked for and never otherwise. */
  .brand-ver{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;
    /* --text-faint and no more. Stacking opacity on it measured 3.74:1 on dark
       and 2.93:1 on light, and 9.5px is body size for contrast. The token alone
       is 5.97:1 and 5.00:1, and it is already the quietest ink on the board. */
    color:var(--text-faint);white-space:nowrap;
    align-self:flex-end;padding-bottom:5px
  }
  .brand-ver:empty{display:none}
  .brand-word{position:relative;height:28px;display:flex;align-items:center;overflow:hidden}
  /* THE ONE ENTRANCE ANIMATION, and it is a deliberate exception. This theme
     has no entrance vocabulary: nothing else on the board moves on arrival,
     because chrome that announces itself is chrome you have to wait for. The
     mark is not chrome. It is the one moment the board is allowed to be a
     brand, it happens once per load, and it is over in seven tenths of a
     second. Anything longer is a splash screen. */
  .brand-word svg{
    height:21px;width:auto;color:var(--text);display:block;
    /* Locked to the band, not merely timed near it. See brand-uncover. */
    clip-path:inset(0 100% 0 0);animation:brand-uncover .62s linear 1.46s forwards
  }
  .brand-band{
    position:absolute;inset:0;display:flex;flex-direction:column;
    /* Unfurled, not flown in. It used to be a finished three-colour block that
       slid in from off-canvas, which read as a card being dealt from somewhere
       outside the page. Clipped from the left edge instead, it grows out of the
       figure standing there, which is where the plume already is. */
    clip-path:inset(0 100% 0 0);
    animation:brand-unfurl .62s linear 1.46s forwards;
    pointer-events:none
  }
  .brand-band i{flex:1}
  .brand-band i:nth-child(1){background:var(--band-1)}
  .brand-band i:nth-child(2){background:var(--band-2)}
  .brand-band i:nth-child(3){background:var(--band-3)}
  /* THE TWO HALVES MUST BE ONE TIMELINE, and the first cut was not.
     The band swept on its own curve while the word faded up on another, so the
     word was already 90% drawn a fifth of a second in, sitting under an opaque
     bar that had not reached it yet. Nothing was revealing anything; two things
     were happening near each other.

     A wipe is one constraint: the width of word showing must EQUAL the width the
     band has vacated. The band occupies [left, 100%], so it has vacated [0,
     left] -- which means the word's right inset must be exactly 100% minus the
     band's left inset, at every instant. That is only true if both run the same
     duration, the same delay, the same keyframe split and the same per-segment
     easing. They do, below. Change one and you must change its pair.

     Two curves, because it is two gestures. Out of the plume it decelerates,
     the way something unfurling runs out of slack. Away to the right it moves
     off evenly, because that half is not the band leaving, it is the wordmark
     arriving, and the wordmark should not be flung at anyone. */
  @keyframes brand-unfurl{
    0%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.16,.84,.44,1)}
    44%{clip-path:inset(0 0 0 0);animation-timing-function:cubic-bezier(.45,.05,.25,1)}
    100%{clip-path:inset(0 0 0 100%)}
  }
  @keyframes brand-uncover{
    0%{clip-path:inset(0 100% 0 0)}
    /* held: through the whole unfurl the word is behind the band anyway */
    44%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.45,.05,.25,1)}
    100%{clip-path:inset(0 0 0 0)}
  }

<script>
"use strict";

/* ── The mark ─────────────────────────────────────────────────────────────
   Two figures and two wordmarks. ADJUDANTE is the other one, and she is not
   random on the one day it would be a shame to leave to chance.

   Each figure is TWO drawings, the refined artwork of 2026-09-11: the light
   one is the inked head, the dark one is its inverse, the head drawn as a
   pale line on the ground. The dark scheme used to be the light drawing with
   its ink swapped by a custom property, which flattened an illustration into
   a silhouette; a drawing made for the ground is a better thing than a
   recoloured one. Paths are scaled to a 100-wide box at two decimals, which
   is the precision that closes the hairline seams. His file carried eight
   flecks of an earlier crown, none over three pixels at 300px wide; dropped.
   The invisible fill:none silhouette in the inverse files is dropped too. */

/* International Women's Day is always hers. Every other day it is a third of
   the time, decided per render, which is the point of an easter egg. */
const HER_ODDS=1/3;
function pickMark(){
  const now=new Date();
  const iwd=(now.getMonth()===2 && now.getDate()===8);
  return (iwd || Math.random()<HER_ODDS) ? MARK.her : MARK.him;
}
/* The drawing follows the scheme. The figure is picked ONCE and held, so a
   scheme flip repaints the same face in its other drawing rather than rolling
   the dice again. Inline, not a data: URI, so the page owns the paths and no
   second file is fetched: the board is offline-locked. */
/* Replaced by board.py at scaffold time from the plugin's own plugin.json.
   The template's own value is what an un-scaffolded copy shows. */
const ADJUDANT_VERSION=/*ADJ_VERSION_START*/""/*ADJ_VERSION_END*/;
const SVGNS="http://www.w3.org/2000/svg";
/* The band, not the figure. At 16px the head is a smudge and three stripes are
   unmistakable, and the stripes belong to whichever figure the roll produced,
   so the tab carries the easter egg too. A data URI fetches nothing, which is
   what validator 24 guards: it bans a url() pointing off-machine, not url(). */
function paintFavicon(band){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
    +'<rect width="24" height="24" fill="'+band[0]+'"/>'
    +'<rect y="8" width="24" height="8" fill="'+band[1]+'"/>'
    +'<rect y="16" width="24" height="8" fill="'+band[2]+'"/></svg>';
  let link=document.querySelector('link[rel="icon"]');
  if(!link){ link=document.createElement("link"); link.rel="icon"; document.head.appendChild(link); }
  link.type="image/svg+xml";
  link.href="data:image/svg+xml,"+encodeURIComponent(svg);
}
let markFigure=null;
const DARK_SCHEME=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):{matches:false};
function paintMark(){
  if(!markFigure) markFigure=pickMark();
  const m=markFigure;
  const art=DARK_SCHEME.matches ? m.dark : m.light;
  const fig=document.getElementById("brandMark");
  const svg=document.getElementById("brandWord");
  if(!fig||!svg) return;
  fig.setAttribute("viewBox","0 0 100 "+art.vh);
  fig.textContent="";
  art.fig.forEach(([fill,d])=>{
    const path=document.createElementNS(SVGNS,"path");
    path.setAttribute("fill",fill);
    path.setAttribute("d",d);
    fig.appendChild(path);
  });
  /* the band is the wipe and the tab too */
  const band=markFigure.band;
  band.forEach((c,i)=>document.documentElement.style.setProperty("--band-"+(i+1),c));
  paintFavicon(band);
}

(function(){
  "use strict";

  /* ── Data file: dashboard-data.json, next to this file ── */
  const DATA_FILE = "dashboard-data.json";
  let state = null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderBeanStats(beans) {
    const c = document.getElementById("beanStats");
    c.innerHTML = "";
    if (!beans) { c.appendChild(el("div", "empty", "No bean data.")); return; }
    const pairs = [
      ["open", beans.open || 0, ""],
      ["doing", beans.doing || 0, "ok"],
      ["critical", beans.critical || 0, "bad"],
      ["bugs", beans.bugs || 0, ""],
      ["milestones", beans.milestones || 0, "accent"],
      ["epics", beans.epics || 0, "accent"],
    ];
    for (const [label, n, cls] of pairs) {
      const s = el("div", "stat" + (cls ? " " + cls : ""));
      s.appendChild(el("div", "n", String(n)));
      s.appendChild(el("div", "label", label));
      c.appendChild(s);
    }
  }

  function renderSessions(sessions) {
    const c = document.getElementById("sessionList");
    c.innerHTML = "";
    if (!sessions || !sessions.length) { c.appendChild(el("li", "empty", "No active sessions.")); return; }
    for (const s of sessions) {
      const li = el("li", "session-item");
      const dot = el("span", "session-dot " + (s.active ? "active" : "idle"));
      li.appendChild(dot);
      const name = el("span", "session-name", s.name || s.id || "unknown");
      li.appendChild(name);
      if (s.beans && s.beans.length) {
        const b = el("span", "session-beans", s.beans.join(", "));
        li.appendChild(b);
      }
      if (s.age) {
        const a = el("span", "session-age", s.age);
        li.appendChild(a);
      }
      c.appendChild(li);
    }
  }

  function renderDispatches(dispatches) {
    const c = document.getElementById("dispatchList");
    c.innerHTML = "";
    if (!dispatches || !dispatches.length) { c.appendChild(el("li", "empty", "No dispatches logged.")); return; }
    for (const d of dispatches.slice(-20).reverse()) {
      const li = el("li", "dispatch-item");
      li.appendChild(el("span", "ts", d.ts || ""));
      const mid = el("div", "");
      mid.appendChild(el("span", "target", d.target || ""));
      if (d.bean) mid.appendChild(el("span", "bean", " " + d.bean));
      li.appendChild(mid);
      li.appendChild(el("span", "excerpt", d.excerpt || ""));
      c.appendChild(li);
    }
  }

  function renderProgress(progress) {
    const c = document.getElementById("progressList");
    c.innerHTML = "";
    if (!progress || !progress.length) { c.appendChild(el("li", "empty", "No session progress tracked.")); return; }
    for (const p of progress) {
      const li = el("li", "progress-item");
      const hdr = el("div", "progress-header");
      hdr.appendChild(el("span", "progress-session", p.session || "unknown"));
      hdr.appendChild(el("span", "progress-count", (p.beans || []).length + " beans"));
      li.appendChild(hdr);
      if (p.beans && p.beans.length) {
        const row = el("div", "progress-beans");
        for (const b of p.beans) {
          row.appendChild(el("span", "progress-bean", b));
        }
        li.appendChild(row);
      }
      c.appendChild(li);
    }
  }

  function render() {
    if (!state) return;
    document.getElementById("title").textContent = state.title || "Orchestrator";
    document.getElementById("subtitle").textContent = state.subtitle || "";
    document.getElementById("updated").textContent = state.updated ? "Updated " + state.updated : "";
    document.getElementById("ver").textContent = state.version || "";
    renderBeanStats(state.beans);
    renderSessions(state.sessions);
    renderDispatches(state.dispatches);
    renderProgress(state.progress);
  }

  function boot() {
    paintMark();
    const m = markFigure;
    if (m) {
      document.getElementById("subtitle").textContent = m.label;
      const sub_label = document.querySelector(".sub-label");
      if (sub_label) sub_label.textContent = m.label === "Adjudante" ? "ORCHESTRATRICE" : "ORCHESTRATOR";
    }
    if (ADJUDANT_VERSION) {
      const v = document.getElementById("ver");
      if (v) v.textContent = "v" + ADJUDANT_VERSION;
    }
    setTimeout(() => document.body.classList.remove("loading"), 1400);
  }

  fetch(DATA_FILE)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { state = d; render(); boot(); })
    .catch(() => {
      state = {
        title: "Orchestrator",
        subtitle: "No dashboard data found. Run: python3 board.py dashboard",
        beans: null, sessions: [], dispatches: [], progress: []
      };
      render(); boot();
    });
})();
</script>
